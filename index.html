<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo - VIP Violet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'vip-primary': '#8B5CF6',     /* Violeta premium */
              'vip-hover': '#7C3AED',       
              'vip-dark': '#0F172A',        /* Slate 900 */
              'vip-gray': '#64748B',        /* Slate 500 */
              'vip-bg': '#F8FAFC',          /* Slate 50 - Blanco roto muy limpio */
              'vip-border': '#E2E8F0',      /* Slate 200 */
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { background-color: #F8FAFC; color: #0F172A; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
        /* Scrollbar sutil */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }
    </style>
</head>
<body class="antialiased min-h-screen pb-16 md:pb-8 pt-0 md:pt-8">

    <main class="md:max-w-2xl md:mx-auto bg-white md:min-h-screen md:rounded-3xl md:border md:border-vip-border md:shadow-xl overflow-hidden relative">
        
        <!-- Header -->
        <header class="glass-header sticky top-0 z-50 flex items-center justify-between p-4 border-b border-vip-border">
            <div class="flex items-center gap-4">
                <button class="text-vip-dark hover:text-vip-primary transition bg-vip-bg p-2 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </button>
                <div>
                    <h1 class="text-lg font-bold leading-tight flex items-center gap-1">
                        Creador Oficial
                        <svg class="w-4 h-4 text-vip-primary" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                    </h1>
                </div>
            </div>
            <button class="text-vip-gray hover:text-vip-primary transition bg-vip-bg p-2 rounded-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
            </button>
        </header>

        <!-- Cover Photo (Con un toque de gradiente) -->
        <div class="h-40 md:h-56 w-full relative overflow-hidden bg-gradient-to-tr from-indigo-100 via-purple-100 to-pink-100">
        </div>

        <!-- Profile Info Section -->
        <div class="px-5 relative pb-6 border-b border-vip-border">
            <div class="flex justify-between items-end -mt-12 relative z-10 mb-4">
                <!-- Avatar -->
                <div class="w-24 h-24 rounded-2xl bg-white border-4 border-white overflow-hidden flex items-center justify-center shadow-md rotate-3 hover:rotate-0 transition-transform duration-300">
                    <div class="w-full h-full bg-gradient-to-br from-vip-primary to-pink-300 flex items-center justify-center text-4xl">📸</div>
                </div>
                <!-- Action Buttons -->
                <div class="flex gap-2">
                    <button class="w-10 h-10 rounded-xl bg-vip-bg flex items-center justify-center text-vip-dark hover:bg-vip-primary hover:text-white transition shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                    <button class="w-10 h-10 rounded-xl bg-vip-bg flex items-center justify-center text-vip-dark hover:bg-vip-primary hover:text-white transition shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    </button>
                </div>
            </div>

            <div>
                <h2 class="text-2xl font-bold text-vip-dark flex items-center gap-1.5">
                    Creador Oficial 
                    <svg class="w-6 h-6 text-vip-primary" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                </h2>
                <p class="text-vip-gray text-sm font-medium">@creador_oficial</p>
            </div>

            <div class="mt-4 text-sm text-vip-dark/80 leading-relaxed">
                <p>Tu espacio VIP exclusivo ✨<br>Nuevas fotos y videos todos los días.<br>Mándame un DM, respondo siempre 📩</p>
            </div>

            <!-- Stats -->
            <div class="flex gap-4 mt-4 mb-5 text-sm">
                <div class="bg-vip-bg px-3 py-1.5 rounded-lg font-medium text-vip-dark">123 <span class="text-vip-gray font-normal">Posts</span></div>
                <div class="bg-vip-bg px-3 py-1.5 rounded-lg font-medium text-vip-dark">34k <span class="text-vip-gray font-normal">Likes</span></div>
            </div>

            <!-- Subscribe Button -->
            <button class="w-full bg-vip-dark text-white font-semibold py-3.5 rounded-2xl hover:bg-vip-primary transition-colors shadow-lg flex items-center justify-center gap-2">
                <span>Suscribirse</span>
                <span class="bg-white/20 px-2 py-0.5 rounded text-sm">$4.99 / mes</span>
            </button>
        </div>

        <!-- Feed Filter Tabs -->
        <div class="flex p-2 gap-2 border-b border-vip-border bg-vip-bg/50">
            <div class="flex-1 py-2 text-center bg-white shadow-sm rounded-xl text-vip-dark font-semibold cursor-pointer text-sm">
                Todo
            </div>
            <div class="flex-1 py-2 text-center text-vip-gray font-medium cursor-pointer hover:text-vip-dark transition text-sm">
                Fotos
            </div>
            <div class="flex-1 py-2 text-center text-vip-gray font-medium cursor-pointer hover:text-vip-dark transition text-sm">
                Videos
            </div>
        </div>

        <!-- Posts List -->
        <div class="flex flex-col bg-vip-bg/30">
            
            <!-- Post 1 (Free/Unlocked) -->
            <article class="p-5 border-b border-vip-border bg-white mb-2 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center text-xl overflow-hidden border border-vip-border">📸</div>
                        <div>
                            <h3 class="font-bold text-vip-dark text-sm flex items-center gap-1">Creador Oficial <svg class="w-4 h-4 text-vip-primary" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></h3>
                            <p class="text-xs text-vip-gray font-medium">Hace 2 horas</p>
                        </div>
                    </div>
                    <button class="text-vip-gray hover:text-vip-dark bg-vip-bg p-1.5 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"></path></svg></button>
                </div>
                <p class="text-sm mb-4 text-vip-dark/90 leading-relaxed">¡Buenos días! Ya está disponible el nuevo set de fotos en la playa 🌊🌴</p>
                
                <div class="w-full h-72 bg-vip-bg rounded-2xl mb-4 border border-vip-border flex flex-col items-center justify-center shadow-inner">
                    <svg class="w-10 h-10 text-vip-gray mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                
                <!-- Icon Bar -->
                <div class="flex items-center justify-between text-vip-gray pt-1">
                    <div class="flex gap-2">
                        <button class="flex items-center gap-1.5 hover:text-vip-primary hover:bg-purple-50 transition px-2 py-1.5 rounded-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            <span class="text-sm font-semibold">1.2k</span>
                        </button>
                        <button class="flex items-center gap-1.5 hover:text-vip-primary hover:bg-purple-50 transition px-2 py-1.5 rounded-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            <span class="text-sm font-semibold">45</span>
                        </button>
                    </div>
                    <button class="flex items-center gap-1.5 text-vip-primary bg-purple-50 hover:bg-purple-100 transition font-semibold text-sm px-4 py-2 rounded-xl">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Tip
                    </button>
                </div>
            </article>

        </div>
    </main>
    
    <!-- Bottom Mobile Nav (Estilo flotante moderno) -->
    <div class="md:hidden fixed bottom-4 w-full px-4 z-50">
        <nav class="bg-vip-dark text-white rounded-2xl shadow-2xl flex justify-around p-3 items-center border border-white/10 backdrop-blur-lg">
            <button class="p-2 text-vip-primary bg-white/10 rounded-xl"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg></button>
            <button class="p-2 text-white/60 hover:text-white transition relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span class="absolute top-2 right-2 w-2 h-2 bg-pink-500 rounded-full ring-2 ring-vip-dark"></span>
            </button>
            <button class="p-2 text-white/60 hover:text-white transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></button>
        </nav>
    </div>
</body>
</html>
