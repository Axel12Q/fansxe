name: Validar y publicar Fansxe
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fansxe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: find server api -name '*.php' -print0 | xargs -0 -n1 php -l
  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install paramiko==4.0.0
      - name: Preparar, migrar y activar
        env:
          FANSXE_SSH_PASSWORD: ${{ secrets.IONOS_SSH_PASSWORD }}
        run: |
          python scripts/deploy.py --prepare | tee release.log
          release=$(sed -n 's/^RELEASE=//p' release.log)
          test -n "$release"
          python scripts/deploy.py --activate "$release"
