name: Subir por SFTP automaticamente

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🎉 Deploy SFTP
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Descargando el codigo
      uses: actions/checkout@v4
    
    - name: 📂 Subiendo por SFTP puro
      uses: wangyucode/sftp-upload-action@v2.0.2
      with:
        host: access-5021305806.webspace-host.com
        username: su81402
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        localDir: '.'
        remoteDir: '/'
        exclude: '.git/**,.github/**'